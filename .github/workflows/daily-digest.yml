name: Generate Consumer Signal Feeds

on:
  schedule:
    - cron: '0 22 * * *'  # UTC 22:00 = Beijing 06:00
  workflow_dispatch:
    inputs:
      generate_summaries:
        description: 'Generate optional source-bound summaries for manual debugging.'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      feed_scope:
        description: 'Limit a manual run to one active feed type.'
        required: false
        default: 'all'
        type: choice
        options: ['all', 'x', 'blogs']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-central.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Generate consumer-electronics feeds
        env:
          TWITTER_COOKIES: ${{ secrets.TWITTER_COOKIES }}
        run: |
          if [ "${{ inputs.feed_scope }}" = "x" ]; then
            python scripts/generate_feed.py --twitter-only
          elif [ "${{ inputs.feed_scope }}" = "blogs" ]; then
            python scripts/generate_feed.py --blogs-only
          else
            python scripts/generate_feed.py
          fi

      - name: Validate feed uniqueness
        run: python scripts/validate_feeds.py

      - name: Generate optional central summaries
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_summaries == 'true' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            python scripts/generate_summaries.py --profile zh_standard --max-workers 3
          else
            echo "DEEPSEEK_API_KEY is not set; skipping optional summaries."
          fi

      - name: Commit feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/feed-x.json feeds/feed-podcasts.json feeds/feed-arxiv.json feeds/feed-blogs.json -f
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.generate_summaries }}" = "true" ]; then
            [ -f feeds/feed-summaries.json ] && git add feeds/feed-summaries.json -f
            [ -d content/summaries ] && git add content/summaries -f
          fi
          git diff --staged --quiet || git commit -m "Consumer signal update $(date -u +%Y-%m-%d)"
          git push
